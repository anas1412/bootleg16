# Builds the Linux and Windows installers; a tag `v*` also publishes them as a GitHub release
# (v0.1.0-alpha -> release 0.1.0-alpha). Run it by hand from the Actions tab to just build.
# The game data is in the repo (gamedata/). The lobby's address goes in the repository
# variable BOOTLEG16_LOBBY (host:port); without it the game is built with no lobby address.
name: installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  BOOTLEG16_LOBBY: ${{ vars.BOOTLEG16_LOBBY }}
  # Opus (audiopus_sys) builds with CMake: CMake 4 refuses its old minimum version without this
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # the version in the installers' names: the tag without its v, else the crate's
  VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || '' }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libopus-dev libwayland-dev libxkbcommon-dev clang mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p client --no-default-features --features steam
      - run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: bootleg16-linux, path: dist/bootleg16-*-linux.tar.gz }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: choco install innosetup -y --no-progress
      - run: cargo build --release -p client --no-default-features --features steam
      - name: Stage and build the installer
        shell: bash
        run: |
          mkdir -p dist/win/data && cp -r gamedata/. dist/win/data/
          cp target/release/client.exe dist/win/bootleg16.exe
          # (steamworks-sys leaves Steam's dll in its build dir; the game needs it next to the exe)
          cp "$(ls target/release/build/steamworks-sys-*/out/steam_api64.dll | head -n1)" dist/win/
          version="${VERSION#v}"
          [ -n "$version" ] || version=$(sed -n 's/^version = "\(.*\)"/\1/p' client/Cargo.toml | head -n1)
          # (MSYS2_ARG_CONV_EXCL: Git Bash would turn /DVersion=.. into a path)
          MSYS2_ARG_CONV_EXCL='*' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DVersion=$version" "/DStage=..\\..\\dist\\win" packaging/windows/bootleg16.iss
      - uses: actions/upload-artifact@v4
        with: { name: bootleg16-windows, path: dist/bootleg16-*-windows-setup.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME#v}" --prerelease \
            --notes "Alpha build. Needs Steam running and signed in (without it the game says so and quits). Linux: unpack the .tar.gz and run ./install.sh. Windows: run the setup .exe. Practice (solo) works without a server."
