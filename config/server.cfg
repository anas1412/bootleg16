# bootleg16 match rules. Copy next to the server (or pass --config path).
# Defaults: CS2 Competitive format with CS 1.6 guns and money (see docs/RULES.md).
# Times are in seconds.

max_rounds = 24          # MR12: first to 13, sides swap after 12
overtime_rounds = 6      # MR3 overtime at 12-12; 0 = a tie is a draw
overtime_money = 10000

freeze_time = 15
buy_time = 20            # after freeze time ends
round_time = 115         # 1:55
c4_timer = 40
defuse_time = 10
defuse_kit_time = 5
round_end_delay = 5

start_money = 800
max_money = 16000
loss_bonus = per_team    # per_team (CS2-style ladder) or cs16 (one shared bonus, exact 1.6)
friendly_fire = false
