# bootleg16 match rules. Copy next to the server (or pass --config path).
# Defaults: CS2 Competitive format with CS 1.6 guns and money (see docs/RULES.md).
# Times are in seconds.

max_rounds = 24          # MR12: first to 13, sides swap after 12
overtime_rounds = 6      # MR3 overtime at 12-12; 0 = a tie is a draw
overtime_money = 10000

freeze_time = 15
buy_time = 20            # after freeze time ends
round_time = 115         # 1:55
c4_timer = 40
defuse_time = 10
defuse_kit_time = 5
round_end_delay = 5

start_money = 800
max_money = 16000
loss_bonus = per_team    # per_team (CS2-style ladder) or cs16 (one shared bonus, exact 1.6)
friendly_fire = false
voice_range = 1500       # how far proximity voice carries (units; team voice reaches everywhere)

# Matchmaking (see README "Hosting")
name = "bootleg16 server"
region = "eu"
max_players = 10
master = ""              # host:port of the lobby to take matches from (empty = none)
official_token = ""      # secret from the lobby's tokens file: only official servers get matches
mode = "match"           # match (5 v 5, booked by the lobby) or deathmatch (drop in, max_players 20)
demos = ""               # folder to record every booked match into (empty = no recordings)
demo_days = 14           # recordings older than this are deleted
public_address = ""      # ip:port players connect to (empty = what the lobby sees; set it behind NAT/Docker)
