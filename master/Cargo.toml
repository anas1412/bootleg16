[package]
name = "master"
version = "0.1.0"
edition = "2021"

# The lobby: parties, matchmaking, the game-server pool (see net/src/master.rs).
[dependencies]
net = { path = "../net" }
steamworks = { version = "0.13", optional = true }

[features]
# Check players' Steam logins with Steam (needs Steam's steamclient.so on the machine).
steam = ["dep:steamworks", "dep:steamworks-sys"]

[build-dependencies]
# Built first so build.rs can put Steam's libsteam_api.so next to the lobby.
steamworks-sys = { version = "0.13", optional = true }
