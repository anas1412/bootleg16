[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
goldsrc = { path = "../goldsrc" }
sim = { path = "../sim" }
client_core = { path = "../client_core" }
net = { path = "../net" }
bevy = { version = "0.20", features = ["wav"] }
# Small randomness (the assistant's blinks, the voice level bars, host ids).
fastrand = "2"
# Steam: sign-in, friends, invites (feature `steam`).
steamworks = { version = "0.13", optional = true }

[build-dependencies]
# Built first so build.rs can put Steam's libsteam_api.so next to the game.
steamworks-sys = { version = "0.13", optional = true }

[features]
# Development builds link Bevy as a shared library (rebuilds only link our code).
# Release / shipping: `cargo build --release -p client --no-default-features --features steam`.
default = ["dev", "steam"]
dev = ["bevy/dynamic_linking"]
# Steam sign-in, friends and invites (plays anonymously when Steam isn't running).
steam = ["dep:steamworks", "dep:steamworks-sys"]
# Per-system timings: `cargo build -p client --features profile`, run, open trace-*.json in ui.perfetto.dev.
profile = ["bevy/trace_chrome"]

# The "Steam needed" message box on Windows (release builds without Steam).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
